[project]
name = "cheat-oracle"
version = "0.0.0"
description = "An in-container answer-key detector is a detector the subject can reach. cheat-oracle models, measures, closes the reachable-channel undercount, and states the floor even the fix cannot close."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Mathew Stevens" }]
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = ["pytest>=8.3", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cheat_oracle"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
# ruff only skips .venv by way of .gitignore, and only inside a git work tree. Exclude it outright
# so `ruff check .` cannot go red on a vendored virtualenv in CI or in a tarball checkout.
extend-exclude = [".venv", ".venv-*"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]
